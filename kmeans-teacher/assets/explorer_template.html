<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>K-means Explorer</title>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --ink: #1d1d1b; --ink-2: #55534d; --line: #dedbd2;
  --muted-point: #b9b6ad; --accent: #2a78d6; --pos: 42,120,214; --neg: 232,116,59;
  --good: #19784f; --warn: #a3620a; --bad: #b3361f;
  --good-bg: #e3f2ea; --warn-bg: #fbf0dc; --bad-bg: #fbe6e1;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #151514; --surface: #1f1f1d; --ink: #f0eee8; --ink-2: #b4b1a8; --line: #3a3934;
    --muted-point: #5b5953; --accent: #6aa5ec; --pos: 106,165,236; --neg: 240,146,96;
    --good: #6fd0a3; --warn: #f0b860; --bad: #f08a74;
    --good-bg: #17302a; --warn-bg: #352a14; --bad-bg: #3a1f19;
  }
}
:root[data-theme="dark"] {
  --bg: #151514; --surface: #1f1f1d; --ink: #f0eee8; --ink-2: #b4b1a8; --line: #3a3934;
  --muted-point: #5b5953; --accent: #6aa5ec; --pos: 106,165,236; --neg: 240,146,96;
  --good: #6fd0a3; --warn: #f0b860; --bad: #f08a74;
  --good-bg: #17302a; --warn-bg: #352a14; --bad-bg: #3a1f19;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
h1 { font-size: 2rem; line-height: 1.15; margin: 0 0 6px; letter-spacing: -0.01em; }
h2 { font-size: 1.35rem; margin: 0 0 4px; }
.sub { color: var(--ink-2); margin: 0; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 20px; margin-top: 20px;
}
.card > .sub { margin-bottom: 14px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 28px; margin-top: 16px; }
.stat b { display: block; font-size: 1.6rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--ink-2); font-size: 0.9rem; }
.banner { border-radius: 10px; padding: 10px 14px; margin-top: 10px; font-size: 1rem; }
.banner.good { background: var(--good-bg); color: var(--good); }
.banner.warn { background: var(--warn-bg); color: var(--warn); }
.banner.bad { background: var(--bad-bg); color: var(--bad); }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.tabs button, .btn {
  font: inherit; font-size: 1rem; border: 0; cursor: pointer; border-radius: 999px;
  padding: 8px 16px; background: transparent; color: var(--ink);
}
.tabs button[aria-selected="true"] { background: var(--ink); color: var(--surface); }
.btn { border: 1px solid var(--line); background: var(--surface); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn:focus-visible, .tabs button:focus-visible, .chip:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 14px 0 6px; }
.toggle { display: inline-flex; align-items: center; gap: 8px; margin-left: 6px; font-size: 1rem; cursor: pointer; }
.toggle input { width: 20px; height: 20px; accent-color: var(--accent); }
.caption { min-height: 3em; font-size: 1.1rem; margin: 6px 0 10px; }
.caption b { font-variant-numeric: tabular-nums; }
.mapwrap { position: relative; }
canvas { display: block; width: 100%; touch-action: manipulation; }
.axis { display: flex; justify-content: space-between; color: var(--ink-2); font-size: 0.85rem; margin-top: 4px; }
.tip {
  position: absolute; pointer-events: none; background: var(--ink); color: var(--surface);
  border-radius: 8px; padding: 8px 10px; font-size: 0.85rem; line-height: 1.35; display: none;
  max-width: 260px; z-index: 2;
}
.legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
.chip {
  display: inline-flex; align-items: center; gap: 8px; font: inherit; font-size: 0.95rem;
  padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); cursor: pointer;
}
.chip i { width: 14px; height: 14px; border-radius: 50%; display: inline-block; }
.chip.off { opacity: 0.4; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
@media (max-width: 760px) { .grid2 { grid-template-columns: 1fr; } h1 { font-size: 1.6rem; } }
svg text { fill: var(--ink-2); font: 14px system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
/* chart text is in viewBox units, so it shrinks with the chart; compensate on phones */
@media (max-width: 560px) { svg text { font-size: 21px; } }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { padding: 9px 10px; text-align: right; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 0.9rem; color: var(--ink-2); font-weight: 600; }
td small { display: block; color: var(--ink-2); font-size: 0.8rem; }
tr.avg td { font-style: italic; color: var(--ink-2); border-bottom: 0; }
.dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: -1px; }
.bars { display: grid; grid-template-columns: max-content 1fr max-content; gap: 8px 12px; align-items: center; }
.bar { height: 14px; border-radius: 7px; background: var(--accent); }
.bartrack { background: var(--line); border-radius: 7px; }
.note { color: var(--ink-2); font-size: 0.95rem; margin: 10px 0 0; }
.empty { padding: 40px 0; color: var(--ink-2); }
</style>
</head>
<body>
<main id="app"><p class="empty">Loading…</p></main>

<script id="kmeans-data" type="application/json">__KMEANS_DATA__</script>
<script>
(function () {
  "use strict";
  // Same palette as cluster.py, so the PNG charts and this page agree on colours.
  var PALETTE = ["#2a78d6", "#e8743b", "#19a979", "#d64f8f", "#8a6bd6",
                 "#c9a227", "#4fb3c9", "#7f7f7f", "#b0563b", "#5c8a3a"];
  var app = document.getElementById("app");
  var payload;
  try { payload = JSON.parse(document.getElementById("kmeans-data").textContent); }
  catch (e) { payload = null; }
  if (!payload || !payload.results) {
    app.innerHTML = '<p class="empty">No results loaded. Build this page with ' +
      '<code>python scripts/build_explorer.py --results out/results.json --out kmeans_explorer.html</code></p>';
    return;
  }
  var R = payload.results;
  var K = R.k;
  var names = [];
  for (var j = 0; j < K; j++) names.push((payload.names && payload.names[j]) || ("Cluster " + j));
  var reduceMotion = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;

  function color(c) { return PALETTE[c % PALETTE.length]; }
  function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (ch) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]; }); }
  function fmt(v) {
    if (v === null || v === undefined || isNaN(v)) return "–";
    var a = Math.abs(v);
    if (a >= 1000) return Math.round(v).toLocaleString("en-GB");
    if (a >= 100) return v.toFixed(0);
    return v.toFixed(1);
  }
  function pct(v, d) { return (v * 100).toFixed(d === undefined ? 0 : d) + "%"; }
  function el(tag, attrs, html) {
    var n = document.createElement(tag);
    for (var a in (attrs || {})) n.setAttribute(a, attrs[a]);
    if (html !== undefined) n.innerHTML = html;
    return n;
  }

  // ------------------------------------------------------------ header
  var sil = R.silhouette_fair !== null && R.silhouette_fair !== undefined ? R.silhouette_fair : R.silhouette;
  var band = sil >= 0.35 ? "good" : sil >= 0.25 ? "warn" : "bad";
  var title = payload.title || "K-means explorer";
  var head = el("header");
  head.innerHTML =
    "<h1>" + esc(title) + "</h1>" +
    '<p class="sub">' + esc(R.source) + " · " + R.rows.toLocaleString("en-GB") + " rows · clustered on " +
    esc(R.features.join(", ")) + "</p>" +
    '<div class="stats">' +
      '<div class="stat"><b>' + K + "</b><span>clusters (k)</span></div>" +
      '<div class="stat"><b>' + sil.toFixed(2) + "</b><span>silhouette" + (R.silhouette_fair !== null && R.silhouette_fair !== undefined ? " (fair)" : "") + "</span></div>" +
      '<div class="stat"><b>' + (R.scaled ? "On" : "Off") + "</b><span>scaling</span></div>" +
    "</div>";
  var warnings = [];
  warnings.push('<div class="banner ' + band + '">Silhouette ' + sil.toFixed(2) + ": " + esc(R.silhouette_verdict) + ".</div>");
  if (!R.scaled) warnings.push('<div class="banner bad">Scaling is off: the column with the biggest numbers decides the clusters.</div>');
  if (sil < 0.25) warnings.push('<div class="banner bad">K-means always returns k groups, even when there are none. Don\'t build strategy on these.</div>');
  R.centroids.forEach(function (c) {
    if (c.share < 0.02) warnings.push('<div class="banner warn">' + esc(names[c.cluster]) + " holds " + pct(c.share, 1) + " of rows: probably outliers, not a segment.</div>");
    if (c.share > 0.8) warnings.push('<div class="banner warn">' + esc(names[c.cluster]) + " holds " + pct(c.share) + " of rows: this split separates a few unusual rows from everyone else.</div>");
  });
  head.insertAdjacentHTML("beforeend", warnings.join(""));
  app.innerHTML = "";
  app.appendChild(head);

  // ------------------------------------------------------------ map + replay
  var mapCard = el("section", { "class": "card" });
  var hasUnlucky = R.iterations_unlucky && R.iterations_unlucky.length;
  mapCard.innerHTML =
    "<h2>Cluster map</h2>" +
    '<p class="sub">Each dot is one row. Nearby dots are similar. Big circles are centroids, the average member of each cluster.</p>' +
    '<div class="tabs" role="tablist">' +
      '<button role="tab" aria-selected="true" data-mode="final">Final clusters</button>' +
      '<button role="tab" aria-selected="false" data-mode="replay">Watch it run</button>' +
    "</div>" +
    '<div class="controls" id="rc" hidden>' +
      '<button class="btn primary" id="bStep">Step</button>' +
      '<button class="btn" id="bPlay">Play</button>' +
      '<button class="btn" id="bReset">Reset</button>' +
      (hasUnlucky ? '<label class="toggle"><input type="checkbox" id="bUnlucky"> Unlucky start</label>' : "") +
    "</div>" +
    '<p class="caption" id="cap" hidden></p>' +
    '<div class="mapwrap"><canvas id="map" aria-label="Scatter plot of clusters"></canvas><div class="tip" id="tip"></div></div>' +
    '<div class="axis"><span>← PC1 (' + pct(R.pca_variance[0] || 0) + ' of variation) →</span>' +
      (R.pca_variance.length > 1 ? "<span>↑ PC2 (" + pct(R.pca_variance[1]) + ")</span>" : "") + "</div>" +
    '<div class="legend" id="legend"></div>' +
    '<p class="note">The map squashes ' + R.features.length + " columns onto a flat picture (PCA). Overlap here doesn't always mean overlap in the real data.</p>";
  app.appendChild(mapCard);

  var canvas = mapCard.querySelector("#map");
  var ctx = canvas.getContext("2d");
  var tip = mapCard.querySelector("#tip");
  var cap = mapCard.querySelector("#cap");
  var hidden = {};  // clusters faded via the legend

  // Bounds cover every point and every centroid position any replay visits.
  var xs = R.points.map(function (p) { return p.x; }), ys = R.points.map(function (p) { return p.y; });
  [R.iterations, R.iterations_unlucky || []].forEach(function (it) {
    it.forEach(function (s) { s.centroids.forEach(function (c) { xs.push(c[0]); ys.push(c[1]); }); });
  });
  R.centroids.forEach(function (c) { xs.push(c.xy[0]); ys.push(c.xy[1]); });
  var minX = Math.min.apply(null, xs), maxX = Math.max.apply(null, xs);
  var minY = Math.min.apply(null, ys), maxY = Math.max.apply(null, ys);
  if (maxY - minY < 1e-9) { minY -= 1; maxY += 1; }
  var W = 0, H = 0, PAD = 18;
  function sx(x) { return PAD + (x - minX) / (maxX - minX || 1) * (W - 2 * PAD); }
  function sy(y) { return H - PAD - (y - minY) / (maxY - minY) * (H - 2 * PAD); }

  var state = { mode: "final", unlucky: false, frame: 0, anim: null, timer: null, view: null };

  function buildFrames(iters) {
    var f = [{ kind: "start", labels: null, cents: iters[0].centroids, round: 0 }];
    for (var i = 0; i < iters.length; i++) {
      var last = i === iters.length - 1;
      f.push({ kind: last ? "done" : "assign", labels: iters[i].labels, cents: iters[i].centroids, round: i + 1,
               prev: i > 0 ? iters[i - 1].labels : null });
      if (!last) f.push({ kind: "move", labels: iters[i].labels, cents: iters[i + 1].centroids, round: i + 1 });
    }
    return f;
  }
  var framesGood = buildFrames(R.iterations);
  var framesBad = hasUnlucky ? buildFrames(R.iterations_unlucky) : null;
  function frames() { return state.unlucky ? framesBad : framesGood; }
  function iters() { return state.unlucky ? R.iterations_unlucky : R.iterations; }

  function resize() {
    var w = canvas.parentNode.clientWidth;
    var h = Math.round(Math.min(Math.max(w * 0.68, 300), 620));
    var dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(w * dpr); canvas.height = Math.round(h * dpr);
    canvas.style.height = h + "px";
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    W = w; H = h;
    draw();
  }

  function currentView() {
    if (state.mode === "final") {
      return { labels: null, final: true, cents: R.centroids.map(function (c) { return c.xy; }), trail: null };
    }
    var fr = frames()[state.frame];
    var trailEnd = fr.kind === "move" ? fr.round : Math.max(fr.round - 1, 0);
    return { labels: fr.labels, final: false, cents: state.view || fr.cents,
             trail: iters().slice(0, trailEnd + 1).map(function (s) { return s.centroids; }).concat([state.view || fr.cents]) };
  }

  function draw() {
    if (!W) return;
    var v = currentView();
    ctx.clearRect(0, 0, W, H);
    var r = W < 500 ? 2.4 : 3.2;
    var grey = css("--muted-point");
    for (var i = 0; i < R.points.length; i++) {
      var p = R.points[i];
      var c = v.final ? p.c : (v.labels ? v.labels[i] : -1);
      ctx.globalAlpha = c >= 0 && hidden[c] ? 0.08 : 0.7;
      ctx.fillStyle = c >= 0 ? color(c) : grey;
      ctx.beginPath(); ctx.arc(sx(p.x), sy(p.y), r, 0, 6.2832); ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (v.trail && v.trail.length > 1) {
      ctx.lineWidth = 2; ctx.setLineDash([5, 5]);
      for (var k = 0; k < K; k++) {
        ctx.strokeStyle = color(k); ctx.beginPath();
        v.trail.forEach(function (cs, n) { var x = sx(cs[k][0]), y = sy(cs[k][1]); n ? ctx.lineTo(x, y) : ctx.moveTo(x, y); });
        ctx.stroke();
      }
      ctx.setLineDash([]);
    }
    var ink = css("--ink"), surf = css("--surface");
    v.cents.forEach(function (cxy, k) {
      if (hidden[k]) return;
      var x = sx(cxy[0]), y = sy(cxy[1]);
      ctx.beginPath(); ctx.arc(x, y, 11, 0, 6.2832);
      ctx.fillStyle = color(k); ctx.fill();
      ctx.lineWidth = 3; ctx.strokeStyle = surf; ctx.stroke();
      ctx.beginPath(); ctx.arc(x, y, 13, 0, 6.2832);
      ctx.lineWidth = 1.5; ctx.strokeStyle = ink; ctx.stroke();
    });
  }

  function captionFor(fr) {
    var n = iters().length;
    if (fr.kind === "start") return "<b>Start.</b> K-means drops " + K + " centroids at random rows. Nobody belongs to a cluster yet.";
    if (fr.kind === "move") return "<b>Round " + fr.round + " · Update.</b> Each centroid moves to the middle of its members. Watch them slide.";
    var switched = 0;
    if (fr.prev) for (var i = 0; i < fr.labels.length; i++) if (fr.labels[i] !== fr.prev[i]) switched++;
    var lead = "<b>Round " + fr.round + " · Assign.</b> Every row joins its nearest centroid";
    lead += fr.prev ? ": <b>" + switched.toLocaleString("en-GB") + "</b> switched cluster." : ".";
    if (fr.kind !== "done") return lead;
    if (state.unlucky) {
      return "<b>Stuck after " + n + " rounds.</b> Nothing changes any more, but this answer is <b>" +
        R.unlucky_worse_pct + "% worse</b> (more spread inside clusters) than the best one. " +
        "That's why real K-means runs 10 random starts and keeps the best.";
    }
    return "<b>Done in " + n + " rounds.</b> No row switched, so the centroids stop moving. This matches the final answer.";
  }

  function show(i, animate) {
    var fs = frames();
    var from = state.view || fs[state.frame].cents;
    state.frame = Math.max(0, Math.min(i, fs.length - 1));
    var fr = fs[state.frame];
    cap.innerHTML = captionFor(fr) + ' <span class="sub">(' + (state.frame + 1) + "/" + fs.length + ")</span>";
    stepBtn.disabled = state.frame >= fs.length - 1;
    if (state.anim) cancelAnimationFrame(state.anim);
    state.view = null;
    if (animate && !reduceMotion && fr.kind === "move") {
      var t0 = performance.now(), D = 600;
      var tick = function (now) {
        var t = Math.min((now - t0) / D, 1), e = t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
        state.view = fr.cents.map(function (c, k) { return [from[k][0] + (c[0] - from[k][0]) * e, from[k][1] + (c[1] - from[k][1]) * e]; });
        draw();
        if (t < 1) state.anim = requestAnimationFrame(tick); else { state.view = null; state.anim = null; draw(); }
      };
      state.anim = requestAnimationFrame(tick);
    } else draw();
  }

  var stepBtn = mapCard.querySelector("#bStep"), playBtn = mapCard.querySelector("#bPlay");
  function stop() { clearInterval(state.timer); state.timer = null; playBtn.textContent = "Play"; }
  stepBtn.onclick = function () { stop(); show(state.frame + 1, true); };
  mapCard.querySelector("#bReset").onclick = function () { stop(); show(0, false); };
  playBtn.onclick = function () {
    if (state.timer) return stop();
    if (state.frame >= frames().length - 1) show(0, false);
    playBtn.textContent = "Pause";
    state.timer = setInterval(function () {
      if (state.frame >= frames().length - 1) return stop();
      show(state.frame + 1, true);
    }, reduceMotion ? 1100 : 1300);
  };
  if (hasUnlucky) mapCard.querySelector("#bUnlucky").onchange = function (e) {
    stop(); state.unlucky = e.target.checked; state.frame = 0; show(0, false);
  };
  mapCard.querySelectorAll(".tabs button").forEach(function (b) {
    b.onclick = function () {
      stop();
      state.mode = b.getAttribute("data-mode");
      mapCard.querySelectorAll(".tabs button").forEach(function (o) { o.setAttribute("aria-selected", String(o === b)); });
      var replay = state.mode === "replay";
      mapCard.querySelector("#rc").hidden = !replay; cap.hidden = !replay;
      if (replay) show(state.frame, false); else draw();
    };
  });

  var legend = mapCard.querySelector("#legend");
  R.centroids.forEach(function (c) {
    var b = el("button", { "class": "chip", "aria-pressed": "true" },
      '<i style="background:' + color(c.cluster) + '"></i>' + esc(names[c.cluster]) + " · " + pct(c.share));
    b.onclick = function () {
      hidden[c.cluster] = !hidden[c.cluster];
      b.classList.toggle("off", !!hidden[c.cluster]); b.setAttribute("aria-pressed", String(!hidden[c.cluster]));
      draw();
    };
    legend.appendChild(b);
  });

  // Tooltip: nearest point within a few pixels.
  canvas.addEventListener("mousemove", function (e) {
    var rect = canvas.getBoundingClientRect(), mx = e.clientX - rect.left, my = e.clientY - rect.top;
    var best = -1, bd = 64, v = currentView();
    for (var i = 0; i < R.points.length; i++) {
      var dx = sx(R.points[i].x) - mx, dy = sy(R.points[i].y) - my, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    if (best < 0) { tip.style.display = "none"; return; }
    var p = R.points[best], c = v.final ? p.c : (v.labels ? v.labels[best] : -1);
    tip.innerHTML = "<b>" + esc(p.id) + "</b> · " + (c >= 0 ? esc(names[c]) : "unassigned") + "<br>" +
      R.features.map(function (f) { return esc(f) + ": " + fmt(p.v[f]); }).join("<br>");
    tip.style.display = "block";
    var tx = mx + 14, ty = my + 14;
    if (tx + tip.offsetWidth > W) tx = mx - tip.offsetWidth - 14;
    if (ty + tip.offsetHeight > H) ty = my - tip.offsetHeight - 14;
    tip.style.left = tx + "px"; tip.style.top = ty + "px";
  });
  canvas.addEventListener("mouseleave", function () { tip.style.display = "none"; });

  // ------------------------------------------------------------ choosing k
  var S = R.k_scan;
  var kCard = el("section", { "class": "card" });
  kCard.innerHTML = "<h2>Choosing k</h2>" +
    '<p class="sub">Elbow suggests <b>k=' + S.elbow_k + "</b>; silhouette suggests <b>k=" + S.best_silhouette_k +
    "</b>. This run uses <b>k=" + K + "</b>." +
    (S.elbow_k !== S.best_silhouette_k ? " When they disagree, the business question decides." : "") + "</p>" +
    '<div class="grid2"><div><h3 class="sub">Elbow: look for the bend</h3>' + elbowSvg() + "</div>" +
    '<div><h3 class="sub">Silhouette: higher is better</h3>' + silSvg() + "</div></div>";
  app.appendChild(kCard);

  function chartFrame(vals, lo, hi, plot) {
    var w = 480, h = 286, l = 54, rt = 12, t = 16, b = 52;
    var ks = S.ks, n = ks.length, inset = 22;
    // Round the axis to tidy steps (1, 2 or 5 x a power of ten)
    var raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    var step = [1, 2, 5, 10].map(function (m) { return m * mag; }).filter(function (s) { return s >= raw; })[0];
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    var x = function (i) { return l + inset + (n === 1 ? (w - l - rt - 2 * inset) / 2 : i / (n - 1) * (w - l - rt - 2 * inset)); };
    var y = function (v) { return t + (1 - (v - lo) / (hi - lo || 1)) * (h - t - b); };
    var s = '<svg viewBox="0 0 ' + w + " " + h + '" width="100%" role="img">';
    for (var gv = lo; gv <= hi + step / 2; gv += step) {
      var gy = y(gv);
      s += '<line x1="' + l + '" x2="' + (w - rt) + '" y1="' + gy + '" y2="' + gy + '" stroke="var(--line)"/>';
      s += '<text x="' + (l - 8) + '" y="' + (gy + 5) + '" text-anchor="end">' + (step < 1 ? gv.toFixed(step < 0.1 ? 2 : 1) : fmtShort(gv)) + "</text>";
    }
    ks.forEach(function (k, i) { s += '<text x="' + x(i) + '" y="' + (h - b + 22) + '" text-anchor="middle">' + k + "</text>"; });
    s += '<text x="' + ((w + l) / 2) + '" y="' + (h - 1) + '" text-anchor="middle">k (number of clusters)</text>';
    return s + plot(x, y) + "</svg>";
  }
  function fmtShort(v) {
    var a = Math.abs(v);
    return a >= 1e6 ? (v / 1e6).toFixed(1) + "M" : a >= 1e3 ? (v / 1e3).toFixed(a >= 1e4 ? 0 : 1) + "k" : v.toFixed(0);
  }
  function elbowSvg() {
    var v = S.inertia;
    return chartFrame(v, 0, Math.max.apply(null, v), function (x, y) {
      var s = "", ci = S.ks.indexOf(K), ei = S.ks.indexOf(S.elbow_k);
      if (ci >= 0) s += '<line x1="' + x(ci) + '" x2="' + x(ci) + '" y1="16" y2="234" stroke="var(--ink-2)" stroke-dasharray="4 4"/>';
      s += '<polyline fill="none" stroke="' + PALETTE[0] + '" stroke-width="3" points="' +
        v.map(function (val, i) { return x(i) + "," + y(val); }).join(" ") + '"/>';
      v.forEach(function (val, i) {
        s += '<circle cx="' + x(i) + '" cy="' + y(val) + '" r="' + (i === ei ? 7 : 4.5) + '" fill="' + PALETTE[0] +
          '" stroke="var(--surface)" stroke-width="2"><title>k=' + S.ks[i] + ": inertia " + fmt(val) + "</title></circle>";
      });
      if (ei >= 0) s += '<text x="' + (x(ei) + 10) + '" y="' + (y(v[ei]) - 10) + '" style="fill:var(--ink);font-weight:600">elbow</text>';
      return s;
    });
  }
  function silSvg() {
    var v = S.silhouette, hi = Math.max(0.6, Math.max.apply(null, v) * 1.1), lo = Math.min(0, Math.min.apply(null, v));    return chartFrame(v, lo, hi, function (x, y) {
      var s = "", n = S.ks.length, bw = Math.min(36, 300 / n);
      v.forEach(function (val, i) {
        var best = S.ks[i] === S.best_silhouette_k, chosen = S.ks[i] === K;
        var top = y(Math.max(val, 0)), bot = y(Math.min(val, 0));
        s += '<rect x="' + (x(i) - bw / 2) + '" y="' + top + '" width="' + bw + '" height="' + Math.max(bot - top, 1) +
          '" rx="3" fill="' + (best ? PALETTE[1] : "var(--muted-point)") + '"' + (chosen ? ' stroke="var(--ink)" stroke-width="2"' : "") +
          "><title>k=" + S.ks[i] + ": silhouette " + val.toFixed(3) + "</title></rect>";
        if (best) s += '<text x="' + x(i) + '" y="' + (top - 8) + '" text-anchor="middle" style="fill:var(--ink);font-weight:600">' + val.toFixed(2) + "</text>";
      });
      return s;
    });
  }

  // ------------------------------------------------------------ centroid profile
  var pCard = el("section", { "class": "card" });
  var rows = R.centroids.map(function (c) {
    return "<tr><td><span class=\"dot\" style=\"background:" + color(c.cluster) + "\"></span>" + esc(names[c.cluster]) + "</td>" +
      "<td>" + c.size.toLocaleString("en-GB") + "<small>" + pct(c.share) + "</small></td>" +
      R.features.map(function (f) {
        var z = c.z[f], a = Math.min(Math.abs(z) / 2, 1) * 0.5;
        var bg = "rgba(" + (z >= 0 ? "var(--pos)" : "var(--neg)") + "," + a.toFixed(2) + ")";
        return '<td style="background:' + bg + '">' + fmt(c.values[f]) + "<small>" + (z >= 0 ? "+" : "−") + Math.abs(z).toFixed(1) + " sd</small></td>";
      }).join("") + "</tr>";
  }).join("");
  pCard.innerHTML = "<h2>What each cluster looks like</h2>" +
    '<p class="sub">Average member of each cluster in original units. Shading shows distance from average in standard deviations (sd): ' +
    '<span style="color:rgb(var(--pos))">blue above</span>, <span style="color:rgb(var(--neg))">orange below</span>.</p>' +
    '<div class="tablewrap"><table><thead><tr><th>Cluster</th><th>Size</th>' +
    R.features.map(function (f) { return "<th>" + esc(f) + "</th>"; }).join("") + "</tr></thead><tbody>" + rows +
    '<tr class="avg"><td>Overall average</td><td>' + R.rows.toLocaleString("en-GB") + "</td>" +
    R.features.map(function (f) { return "<td>" + fmt(R.overall_means[f]) + "</td>"; }).join("") + "</tr></tbody></table></div>";
  app.appendChild(pCard);

  // ------------------------------------------------------------ drivers + describing columns
  var dCard = el("section", { "class": "card" });
  var dKeys = Object.keys(R.drivers);
  dCard.innerHTML = "<h2>What drove the split</h2>" +
    '<p class="sub">How much of each column\'s variation the clusters explain. A column near 100% decided the clusters; near 0% barely mattered.</p>' +
    '<div class="bars">' + dKeys.map(function (f) {
      var v = R.drivers[f] || 0;
      return "<span>" + esc(f) + '</span><div class="bartrack"><div class="bar" style="width:' + Math.max(v * 100, 0.5).toFixed(1) +
        '%"></div></div><b>' + pct(v) + "</b>";
    }).join("") + "</div>";
  app.appendChild(dCard);

  var profKeys = Object.keys(R.profiles || {});
  if (profKeys.length) {
    var oCard = el("section", { "class": "card" });
    var cell = function (v) {
      if (v === null || v === undefined) return "–";
      if (typeof v === "number") return fmt(v);
      return Object.keys(v).map(function (k) { return esc(k) + " " + pct(v[k]); }).join("<br>");
    };
    oCard.innerHTML = "<h2>Describing the clusters</h2>" +
      '<p class="sub">These columns were <b>not</b> used to form the clusters. They describe who ended up in each one.</p>' +
      '<div class="tablewrap"><table><thead><tr><th>Cluster</th>' +
      profKeys.map(function (c) { return "<th>" + esc(c) + "</th>"; }).join("") + "</tr></thead><tbody>" +
      R.centroids.map(function (c) {
        return "<tr><td><span class=\"dot\" style=\"background:" + color(c.cluster) + "\"></span>" + esc(names[c.cluster]) + "</td>" +
          profKeys.map(function (col) {
            var by = R.profiles[col];
            return '<td style="vertical-align:top">' + cell(by[c.cluster] !== undefined ? by[c.cluster] : by[String(c.cluster)]) + "</td>";
          }).join("") + "</tr>";
      }).join("") + "</tbody></table></div>";
    app.appendChild(oCard);
  }

  // ------------------------------------------------------------ download
  var xCard = el("section", { "class": "card" });
  xCard.innerHTML = "<h2>Take the data with you</h2>" +
    '<p class="sub">Every row with its cluster, ready for Excel.</p>' +
    '<div class="controls"><button class="btn primary" id="bCsv">Download CSV</button></div>' +
    (R.notes && R.notes.length ? '<p class="note">Data notes: ' + R.notes.map(esc).join(" ") + "</p>" : "") +
    '<p class="note">Seed ' + R.seed + ". Same data and settings always give the same answer.</p>";
  app.appendChild(xCard);
  xCard.querySelector("#bCsv").onclick = function () {
    var q = function (s) { s = String(s); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
    var lines = [["id", "cluster", "cluster_name"].concat(R.features).map(q).join(",")];
    R.points.forEach(function (p) {
      lines.push([p.id, p.c, names[p.c]].concat(R.features.map(function (f) { return p.v[f]; })).map(q).join(","));
    });
    var blob = new Blob([lines.join("\n")], { type: "text/csv" });
    var a = el("a", { href: URL.createObjectURL(blob), download: "kmeans_clusters.csv" });
    document.body.appendChild(a); a.click(); a.remove();
  };

  window.addEventListener("resize", function () { resize(); });
  if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
  resize();
})();
</script>
</body>
</html>
